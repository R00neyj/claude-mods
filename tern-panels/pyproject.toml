[project]
name = "tern-panels"
version = "0.3.0"
description = "Tern native panels (markdown, webview, mermaid) as MCP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "tern-sdk==0.2.0",
]

[project.scripts]
tern-mcp = "tern_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tern_mcp"]
